plugins {
    id 'com.android.application'
}

// The app ships the website itself: the site files at the repo root become assets/www.
def webAssets = layout.buildDirectory.dir('webAssets')
def copyWebAssets = tasks.register('copyWebAssets', Sync) {
    from(rootProject.file('..')) {
        include 'index.html', 'manifest.json', 'sw.js', 'css/**', 'js/**', 'icons/**'
    }
    into webAssets.map { it.dir('www') }
}

android {
    namespace 'com.thanhhaikia.sirib1'
    compileSdk 34

    defaultConfig {
        applicationId 'com.thanhhaikia.sirib1'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets.main.assets.srcDir webAssets
}

tasks.named('preBuild') { dependsOn copyWebAssets }
